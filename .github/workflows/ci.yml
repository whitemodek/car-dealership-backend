name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dealership
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: dealership_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealership -d dealership_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dealership:integration-only-password@localhost:5432/dealership_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l backend)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Build binaries
        run: go build ./backend/cmd/...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: compose-ci-only-password
      DATABASE_URL: postgres://dealership:compose-ci-only-password@db:5432/dealership?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Start complete stack
        run: docker compose up --build -d
      - name: Check readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/health/ready; then
              curl --fail --silent http://localhost:8080/api/v1/cars
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: docker compose logs --no-color

      - name: Verify backup and restore
        run: |
          docker compose run --rm api /app/manage seed-demo
          docker compose exec -T db pg_dump -U dealership -d dealership -Fc > /tmp/dealership-ci.dump
          docker compose exec -T db createdb -U dealership dealership_restore_check
          docker compose exec -T db pg_restore -U dealership -d dealership_restore_check --exit-on-error < /tmp/dealership-ci.dump
          docker compose run --rm -e DATABASE_URL=postgres://dealership:compose-ci-only-password@db:5432/dealership_restore_check?sslmode=disable api /app/manage migrate
          docker compose run -d --no-deps --name dealership-restore-check -p 127.0.0.1:18080:8080 -e DATABASE_URL=postgres://dealership:compose-ci-only-password@db:5432/dealership_restore_check?sslmode=disable api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:18080/health/ready; then
              curl --fail --silent http://localhost:18080/api/v1/cars | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["items"]) == 2'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Stop disposable CI stack
        if: always()
        run: |
          docker rm -f dealership-restore-check || true
          docker compose down --volumes
