name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate ephemeral database credentials
        run: go run ./backend/cmd/envgen -ci -db-host localhost:5432 -db-name dealership_test
      - name: Start integration database
        run: |
          docker run -d --name integration-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=dealership -e POSTGRES_DB=dealership_test -e POSTGRES_PASSWORD \
            postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec integration-postgres pg_isready -U dealership -d dealership_test; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Check formatting
        run: test -z "$(gofmt -l backend)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Build binaries
        run: go build ./backend/cmd/...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Stop disposable integration database
        if: always()
        run: docker rm -f integration-postgres || true

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate ephemeral database credentials
        run: go run ./backend/cmd/envgen -ci
      - name: Start complete stack
        run: docker compose up --build -d
      - name: Check readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/health/ready; then
              curl --fail --silent http://localhost:8080/api/v1/cars
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Verify backup and restore
        run: |
          docker compose run --rm api /app/manage seed-demo
          docker compose exec -T db pg_dump -U dealership -d dealership -Fc > /tmp/dealership-ci.dump
          docker compose exec -T db createdb -U dealership dealership_restore_check
          docker compose exec -T db pg_restore -U dealership -d dealership_restore_check --exit-on-error < /tmp/dealership-ci.dump
          docker compose run --rm -e DATABASE_URL="$RESTORE_DATABASE_URL" api /app/manage migrate
          docker compose run -d --no-deps --name dealership-restore-check -p 127.0.0.1:18080:8080 -e DATABASE_URL="$RESTORE_DATABASE_URL" api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:18080/health/ready; then
              curl --fail --silent http://localhost:18080/api/v1/cars | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["items"]) == 2'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Stop disposable CI stack
        if: always()
        run: |
          docker rm -f dealership-restore-check || true
          docker compose down --volumes
